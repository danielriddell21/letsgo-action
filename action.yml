name: letsgo release
description: Build, verify and publish a Go release reproducibly.
author: danielriddell21

branding:
  icon: package
  color: blue

inputs:
  version:
    description: >-
      The letsgo release to install, as a tag such as v0.8.0, or "latest".
      Defaults to "latest", so that this action does not need a release of
      its own every time letsgo publishes one. Pin it to a tag when the
      release has to be reproducible: letsgo decides the archive layout and
      the linker flags, so it is a build input exactly as the compiler is.
    required: false
    default: latest

  command:
    description: >-
      The letsgo command to run: release, plan, apply, build, verify, diff,
      tag, promote, yank, audit, doctor or features. Leave empty to install
      letsgo and run nothing.

      plan with no args saves the plan to plan-file, uploads it as the
      plan-artifact artifact and writes it to the job summary. apply with no
      args downloads that artifact and applies it.
    required: false
    default: release

  args:
    description: Extra arguments appended to the command, split on whitespace.
    required: false
    default: ""

  working-directory:
    description: The directory to run in.
    required: false
    default: .

  plan-file:
    description: >-
      The file a saved plan is written to (plan) and read from (apply),
      relative to working-directory.
    required: false
    default: release.plan

  plan-artifact:
    description: >-
      The name the saved plan is uploaded under by plan, and downloaded from
      by apply. Apply downloads it only when no args are given.
    required: false
    default: release.plan

  token:
    description: >-
      The forge token letsgo publishes with. The default workflow token is
      enough for releases in this repository, and is what a release should
      use: it is minted for the run, expires with it, and its permissions are
      declared in the workflow. A Homebrew tap lives in another repository,
      which a workflow token cannot write to at all — that is tap-token's job,
      not this one's.
    required: false
    default: ${{ github.token }}

  tap-token:
    description: >-
      The token the Homebrew formula is published with, for a repository whose
      letsgo.mod carries a brew directive. An App token scoped to the tap
      alone, so that the credential which can write to another repository is
      not also one that can write to this one — and so the App needs no
      installation on the repository being released.

      Empty falls back to token, which is the single-credential arrangement
      every repository used before the two could be told apart. It still
      works; it costs a tap token that can also rewrite this repository's
      releases.
    required: false
    default: ""

outputs:
  letsgo-version:
    description: The letsgo version that ran.
    value: ${{ steps.install.outputs.version }}

  version:
    description: The project version that was built or published, without a leading "v".
    value: ${{ steps.run.outputs.version }}

  release-url:
    description: The release page, when a release was published.
    value: ${{ steps.run.outputs.release-url }}

  manifest:
    description: Path to the release manifest letsgo wrote, when it wrote one.
    value: ${{ steps.run.outputs.manifest }}

  plan-file:
    description: Path to the plan letsgo saved, when command is plan and it saved one.
    value: ${{ steps.run.outputs.plan-file }}

  tag:
    description: >-
      The release's tag, including the module directory prefix for a module
      nested in a monorepo (for example services/api/v1.2.3), when letsgo
      wrote a manifest.
    value: ${{ steps.run.outputs.tag }}

runs:
  using: composite

  steps:
    # Go is a prerequisite rather than something this installs: the version
    # matters to the output, so choosing it belongs to the workflow that knows
    # which one the project releases with.
    - name: Check for Go
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v go >/dev/null 2>&1; then
          echo "::error::letsgo needs Go on the runner. Add actions/setup-go before this step." >&2
          exit 1
        fi
        echo "using $(go version)"

    - name: Install letsgo
      id: install
      shell: bash
      env:
        # Inputs reach the script as environment variables, never as ${{ }}
        # inside it: an interpolated input is a shell injection waiting for
        # someone to name a branch after one.
        LETSGO_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ ! "$LETSGO_VERSION" =~ ^(latest|v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?)$ ]]; then
          echo "::error::version must be \"latest\" or a tag such as v0.8.0, got \"$LETSGO_VERSION\"" >&2
          exit 1
        fi

        # go install, rather than downloading a binary: the module proxy
        # checks what it fetches against the public checksum database, which
        # is a stronger guarantee than any digest this action could carry, and
        # it works on every runner without a platform matrix.
        GOFLAGS=-mod=mod go install "github.com/danielriddell21/letsgo/cmd/letsgo@${LETSGO_VERSION}"

        bin="$(go env GOPATH)/bin"
        echo "$bin" >> "$GITHUB_PATH"

        # version --json is the machine form; an older letsgo has only the
        # text one, so fall back to reading that.
        # An older letsgo ignores the flag and prints the text form, so what
        # comes back has to parse before it is believed.
        if installed="$("$bin/letsgo" version --json 2>/dev/null)" && installed="$(jq -er '.version' <<< "$installed" 2>/dev/null)"; then
          :
        else
          installed="$("$bin/letsgo" version)"
          installed="${installed#letsgo }"
        fi
        echo "version=$installed" >> "$GITHUB_OUTPUT"
        echo "letsgo $installed"

        # Where the plugin store is, as letsgo resolves it, so the cache
        # below follows XDG_DATA_HOME and the global config. An older letsgo
        # cannot say, and gets the default location for the platform.
        if ! plugins="$("$bin/letsgo" plugin dir 2>/dev/null)" || [[ -z "$plugins" ]]; then
          case "$RUNNER_OS" in
            macOS) plugins="$HOME/Library/Application Support/letsgo/plugins" ;;
            Windows) plugins="${LOCALAPPDATA:-$HOME/AppData/Local}/letsgo/plugins" ;;
            *) plugins="${XDG_DATA_HOME:-$HOME/.local/share}/letsgo/plugins" ;;
          esac
        fi
        echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

    # Keyed on letsgo.mod, the file that pins plugin versions: a runner whose
    # pins haven't changed reuses installed plugins instead of rebuilding them
    # from source on every run. The path is the one the installed letsgo
    # reports, not a guess per platform.
    - name: Cache plugin store
      uses: actions/cache@v6
      with:
        path: ${{ steps.install.outputs.plugins }}
        key: ${{ runner.os }}-letsgo-plugins-${{ hashFiles('**/letsgo.mod') }}
        restore-keys: |
          ${{ runner.os }}-letsgo-plugins-

    # The plan was made on another job, on purpose: the job that publishes is
    # not the job that read the forge, and it runs only once the environment's
    # reviewers have approved it.
    - name: Download plan
      if: inputs.command == 'apply' && inputs.args == ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.plan-artifact }}
        path: ${{ runner.temp }}/letsgo-plan

    - name: Run letsgo
      id: run
      if: inputs.command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        LETSGO_TAP_TOKEN: ${{ inputs.tap-token }}
        LETSGO_COMMAND: ${{ inputs.command }}
        LETSGO_ARGS: ${{ inputs.args }}
        LETSGO_PLAN_FILE: ${{ inputs.plan-file }}
        LETSGO_PLAN_DIR: ${{ runner.temp }}/letsgo-plan
        LETSGO_REPOSITORY: ${{ github.repository }}
        LETSGO_SERVER: ${{ github.server_url }}
      run: |
        set -euo pipefail

        # Split on whitespace, which is the only shape an action input can
        # carry; read -a does not expand globs the way an unquoted word would.
        read -r -a args <<< "$LETSGO_ARGS"

        # A bare plan or apply is the approval pipeline: plan saves what it
        # would do, apply does exactly that. Any args at all mean the workflow
        # is running the command its own way, and nothing is added.
        plan_file=""
        if [[ ${#args[@]} -eq 0 ]]; then
          case "$LETSGO_COMMAND" in
            plan)
              plan_file="$PWD/$LETSGO_PLAN_FILE"
              args=(-out "$plan_file")
              ;;
            apply) args=("$LETSGO_PLAN_DIR/$(basename "$LETSGO_PLAN_FILE")") ;;
          esac
        fi

        if [[ -n "$plan_file" ]]; then
          # The plan is what the reviewer approves, so it goes in the summary
          # whether or not the plan succeeded. letsgo renders the summary
          # itself, on stdout; everything else it says stays on stderr, in the
          # job log.
          status=0
          out="$(mktemp)"
          letsgo plan --format md "${args[@]}" > "$out" || status=$?
          if [[ -s "$out" ]]; then
            cat "$out" >> "$GITHUB_STEP_SUMMARY"
          else
            # A plan that fails its gates has no diff to render.
            printf '## letsgo plan\n\nThe plan did not complete; see the job log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ $status -ne 0 ]]; then
            exit "$status"
          fi
          if [[ -f "$plan_file" ]]; then
            echo "plan-file=$plan_file" >> "$GITHUB_OUTPUT"
          fi
        else
          letsgo "$LETSGO_COMMAND" "${args[@]}"
        fi

        # Outputs come from the manifest rather than from parsing stdout: it is
        # the file letsgo writes precisely so that machines do not have to read
        # the part meant for people.
        # head rather than -quit: BSD find and GNU find disagree about the
        # latter, and this runs on whichever the runner has.
        # The newest one, so a stale manifest from an earlier run in the same
        # checkout is not reported in place of the one just written.
        manifest="$(find . -maxdepth 3 -name letsgo.json -exec ls -t {} + 2>/dev/null | head -n 1 || true)"
        if [[ -z "$manifest" ]]; then
          exit 0
        fi

        version="$(jq -r '.version' "$manifest")"
        tag="$(jq -r '.tag // ""' "$manifest")"

        {
          echo "manifest=$manifest"
          echo "version=$version"
          if [[ -n "$tag" ]]; then
            echo "tag=$tag"
          fi
          if [[ -n "$tag" ]]; then
            # A monorepo tag carries slashes, which stay; anything else a tag
            # can hold is escaped.
            escaped="$(jq -rn --arg t "$tag" '$t | split("/") | map(@uri) | join("/")')"
            echo "release-url=${LETSGO_SERVER}/${LETSGO_REPOSITORY}/releases/tag/${escaped}"
          fi
        } >> "$GITHUB_OUTPUT"

    - name: Upload plan
      if: inputs.command == 'plan' && steps.run.outputs.plan-file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.plan-artifact }}
        path: ${{ steps.run.outputs.plan-file }}
        if-no-files-found: error
        retention-days: 7
