name: ci

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  # An action is YAML wrapping shell, and the two are linted by different
  # things: actionlint reads workflows and does not read action metadata, so
  # the action's own file needs its own check.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color

      - name: action.yml
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 .github/lint-action.py

  # The action's own contract: does it install letsgo, run a command, and
  # report what it did? A composite action that is never executed in CI is a
  # shell script nobody has run.
  install-only:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: ./
        id: install
        with:
          command: ""

      - name: letsgo is on PATH and reports the pinned version
        shell: bash
        env:
          INSTALLED: ${{ steps.install.outputs.letsgo-version }}
        run: |
          set -euo pipefail
          letsgo version
          test -n "$INSTALLED"
          echo "installed $INSTALLED"

  # Against a real Go module, so the run step and the manifest-derived outputs
  # are exercised rather than assumed.
  build:
    name: build a fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: create a module to release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture
          cd fixture
          cat > go.mod <<'EOF'
          module example.com/fixture

          go 1.24
          EOF
          cat > main.go <<'EOF'
          package main

          import "fmt"

          var version = "dev"

          func main() { fmt.Println("fixture", version) }
          EOF
          git init -q -b main
          git config user.email ci@example.com
          git config user.name CI
          git add .
          git commit -q -m "fixture"
          git tag v1.2.3

      - uses: ./
        id: built
        with:
          command: build
          working-directory: fixture

      - name: the outputs describe what was built
        shell: bash
        env:
          VERSION: ${{ steps.built.outputs.version }}
          MANIFEST: ${{ steps.built.outputs.manifest }}
        run: |
          set -euo pipefail
          test "$VERSION" = "1.2.3"
          test -f "fixture/$MANIFEST"
          echo "built $VERSION, described by $MANIFEST"

  # An input must not be able to become a command.
  injection:
    name: inputs are not shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: ./
        continue-on-error: true
        with:
          version: "v0.0.0; touch /tmp/pwned"
          command: ""

      - name: nothing ran
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /tmp/pwned ]]; then
            echo "::error::an input reached the shell" >&2
            exit 1
          fi
          echo "the input was rejected rather than executed"
